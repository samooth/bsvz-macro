name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout bsvz-macro
        uses: actions/checkout@v5

      - name: Clean Zig cache
        run: rm -rf zig-pkg

      - name: Install Zig
        uses: ./.github/actions/setup-zig
        with:
          version: "0.16.0"

      # Dependencies (bsvz, zig-wallet-toolbox) are fetched automatically by the
      # Zig package manager from GitHub (see build.zig.zon). No sibling checkout
      # is required.
      - name: Run tests
        run: zig build test

      - name: Run tests with release-safe (sanitizers)
        run: zig build test -Doptimize=ReleaseSafe
